name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          cd homework-app
          npm install

      - name: Build
        env:
          VITE_SUPABASE_URL_PRIMARY: ${{ secrets.VITE_SUPABASE_URL_PRIMARY }}
          VITE_SUPABASE_URL_BACKUP: ${{ secrets.VITE_SUPABASE_URL_BACKUP}}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd homework-app
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: homework-app/dist
          branch: gh-pages
